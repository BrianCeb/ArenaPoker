services:
  postgres:
    image: postgres:16
    container_name: mesas-vivas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesasvivas
      POSTGRES_PASSWORD: mesasvivas_dev
      POSTGRES_DB: mesas_vivas
    ports:
      - "5432:5432"
    volumes:
      - mesas_vivas_data:/var/lib/postgresql/data

volumes:
  mesas_vivas_data:
